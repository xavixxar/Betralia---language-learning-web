<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Il viaggio d'Anna</title>

<link rel="stylesheet" href="../styles.css">


</head>

<body>


<main class="story-page">


    <!-- ============================== -->
    <!-- TÍTULO -->
    <!-- ============================== -->

    <h1>Il viaggio d'Anna</h1>


    <p class="story-info">
        Italian · A1
    </p>


    <hr>





    <!-- ============================== -->
    <!-- HISTORIA -->
    <!-- ============================== -->

    <div class="story-text">


        <p class="sentence">

            <span
                class="word"
                data-translation="Hello, my name is Anna."
            >
                Ciao, mi chiamo Anna.
            </span>

        </p>


        <p class="sentence">

            <span
                class="word"
                data-translation="I live in a small city."
            >
                Abito in una città piccolina.
            </span>

        </p>


        <p class="sentence">

            <span
                class="word"
                data-translation="I like to travel."
            >
                Mi piace viaggiare.
            </span>

        </p>


    </div>


    <!-- ============================== -->
    <!-- VOLVER -->
    <!-- ============================== -->

    <a
        href="../index.html"
        class="back-button"
    >
        ← Return to stories
    </a>


</main>


<!-- ============================== -->
<!-- ID DE LA HISTORIA -->
<!-- ============================== -->

<script>

    const STORY_ID = "il-viaggio-di-anna";

</script>


<!-- ============================== -->
<!-- SUPABASE -->
<!-- ============================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase.js"></script>


<!-- ============================== -->
<!-- VISITAS Y LIKES -->
<!-- ============================== -->

<script src="../story.js"></script>


<!-- ============================== -->
<!-- TRADUCCIONES -->
<!-- ============================== -->

<script>

    const words =
        document.querySelectorAll(".word");


    words.forEach(word => {

        word.addEventListener("click", () => {

            const translation =
                word.dataset.translation;


            const existingTranslation =
                word.nextElementSibling;


            // Si ya está abierta,
            // la cerramos.

            if (
                existingTranslation &&
                existingTranslation.classList.contains("translation")
            ) {

                existingTranslation.remove();

                return;

            }


            // Crear traducción

            const translationElement =
                document.createElement("span");


            translationElement.classList.add(
                "translation"
            );


            translationElement.textContent =
                translation;


            // Mostrar traducción

            word.after(
                translationElement
            );

        });

    });

</script>

</body>

</html>
